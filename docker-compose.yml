version: '3.8'

services:
  robo-cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    image: marshmallow/robo-cleaner:latest
    container_name: robo-cleaner
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms64m -Xmx512m
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - robo-cleaner-network

networks:
  robo-cleaner-network:
    driver: bridge
