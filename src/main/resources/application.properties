# Application
spring.application.name=robo-cleaner

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.marshmallow.robocleaner=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator - expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.info.build.enabled=true

# Info endpoint customization
info.app.name=Robo Cleaner
info.app.description=A robotic cleaner service for navigating and cleaning oil spills
info.app.version=2.0.0
info.app.java.version=${java.version}

# Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true
